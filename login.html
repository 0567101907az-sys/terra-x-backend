<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Terra X - تسجيل الدخول</title>

    <link rel="stylesheet"
          href="login.css">
</head>

<body>

    <div class="login-box">

        <h1>🌍 Terra X</h1>

        <h2>تسجيل الدخول</h2>

        <input
            type="email"
            id="email"
            placeholder="البريد الإلكتروني"
        >

        <input
            type="password"
            id="password"
            placeholder="كلمة المرور"
        >

        <button id="loginButton">
            🔐 تسجيل الدخول
        </button>

        <p id="status">
            أدخل بيانات حسابك.
        </p>

    </div>

    <script src="login.js"></script>

</body>

</html>
