<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra X - مشاركة الموقع</title>

    <link rel="stylesheet" href="location.css">
</head>

<body>

    <div class="location-box">

        <h1>🌍 Terra X</h1>

        <h2>مشاركة الموقع</h2>

        <p>
            عند تفعيل مشاركة الموقع، سيتم مشاركة
            موقع جهازك مع مدير Terra X فقط.
        </p>

        <p>
            المستخدمون الآخرون لن يتمكنوا من رؤية موقعك.
        </p>

        <button id="allowLocation">
            📍 السماح بمشاركة موقعي
        </button>

        <button id="stopLocation">
            🔴 إيقاف مشاركة الموقع
        </button>

        <p id="status">
            مشاركة الموقع متوقفة.
        </p>

    </div>

    <script src="location.js"></script>

</body>
</html>
