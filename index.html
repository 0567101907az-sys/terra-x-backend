<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERRA X</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      color: #e9eef5;
      font-family: Arial, sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      background: rgba(5,8,12,.88);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .logo span {
      font-size: 9px;
      display: block;
      opacity: .5;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .search {
      flex: 1;
      display: flex;
      gap: 6px;
    }

    .search input {
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,.12);
      outline: none;
      background: #10151c;
      color: white;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      background: #18202a;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      background: #222d39;
    }

    .intel-btn {
      background: #1d3345;
    }

    .layers {
      position: absolute;
      z-index: 1000;
      left: 12px;
      bottom: 18px;
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      max-width: calc(100% - 24px);
    }

    .panel {
      position: absolute;
      z-index: 1100;
      top: 86px;
      left: 12px;
      width: min(360px, calc(100% - 24px));
      max-height: calc(100% - 170px);
      overflow-y: auto;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(5,8,12,.92);
      backdrop-filter: blur(14px);
      display: none;
    }

    .panel.show {
      display: block;
    }

    .panel h3 {
      margin: 0 0 12px;
      font-size: 15px;
    }

    .target-card {
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 12px;
      background: #10161d;
      border: 1px solid rgba(255,255,255,.08);
    }

    .target-name {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .target-coords {
      font-size: 11px;
      opacity: .6;
    }

    .empty {
      opacity: .55;
      font-size: 13px;
      padding: 10px 0;
    }

    #intel {
      position: absolute;
      z-index: 2000;
      inset: 0;
      display: none;
      background: #05070a;
    }

    #intel.active {
      display: block;
    }

    #intelMap {
      position: absolute;
      inset: 0;
    }

    .intel-header {
      position: absolute;
      z-index: 2100;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(5,8,12,.9);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
    }

    .intel-title {
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .intel-sub {
      font-size: 9px;
      opacity: .5;
      margin-top: 3px;
    }

    .intel-tools {
      position: absolute;
      z-index: 2100;
      left: 12px;
      right: 12px;
      bottom: 18px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .intel-tools button {
      white-space: nowrap;
      background: rgba(5,8,12,.92);
      border: 1px solid rgba(255,255,255,.12);
    }

    .stats {
      position: absolute;
      z-index: 2100;
      top: 82px;
      left: 12px;
      right: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      pointer-events: none;
    }

    .stat {
      padding: 11px;
      border-radius: 13px;
      background: rgba(5,8,12,.86);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(10px);
    }

    .stat-label {
      font-size: 9px;
      opacity: .5;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 17px;
      font-weight: 900;
    }

    .status {
      position: absolute;
      z-index: 2200;
      left: 12px;
      top: 185px;
      padding: 8px 11px;
      border-radius: 10px;
      background: rgba(5,8,12,.88);
      border: 1px solid rgba(255,255,255,.1);
      font-size: 11px;
      display: none;
    }

    .status.show {
      display: block;
    }

    @media (min-width: 800px) {
      .topbar {
        left: 20px;
        right: 20px;
      }

      .stats {
        left: auto;
        right: 20px;
        width: 320px;
      }

      .intel-tools {
        left: 20px;
        right: auto;
        max-width: calc(100% - 40px);
      }
    }
  </style>
</head>

<body>

<div id="app">

  <div id="map"></div>

  <div class="topbar">
    <div class="logo">
      TERRA X
      <span>GEOSPATIAL INTELLIGENCE</span>
    </div>

    <div class="search">
      <input id="searchInput" placeholder="Search places...">
      <button onclick="searchPlace()">🔎</button>
    </div>

    <button onclick="locateMe()">📍</button>
    <button class="intel-btn" onclick="openIntel()">🛰️</button>
  </div>

  <div id="resultsPanel" class="panel">
    <h3>SEARCH RESULTS</h3>
    <div id="results"></div>
  </div>

  <div class="layers">
    <button onclick="setLayer('street')">Street</button>
    <button onclick="setLayer('satellite')">Satellite</button>
    <button onclick="setLayer('terrain')">Terrain</button>
    <button onclick="loadTargets()">🎯 Targets</button>
  </div>

  <div id="intel">

    <div id="intelMap"></div>

    <div class="intel-header">
      <div>
        <div class="intel-title">TERRA X / INTELLIGENCE</div>
        <div class="intel-sub">GEOSPATIAL ANALYSIS ENGINE</div>
      </div>

      <button onclick="closeIntel()">✕</button>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">Target</div>
        <div id="statTarget" class="stat-value">NONE</div>
      </div>

      <div class="stat">
        <div class="stat-label">Area</div>
        <div id="statArea" class="stat-value">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Buildings</div>
        <div id="statBuildings" class="stat-value">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Events</div>
        <div id="statEvents" class="stat-value">—</div>
      </div>

    </div>

    <div id="status" class="status"></div>

    <div class="intel-tools">
      <button onclick="selectPoint()">📍 Point</button>
      <button onclick="startArea()">🔷 Area</button>
      <button onclick="finishArea()">✓ Finish</button>
      <button onclick="cancelArea()">✕ Cancel</button>
      <button onclick="analyzeTarget()">🧠 Analyze</button>
      <button onclick="saveCurrentTarget()">💾 Save Target</button>
      <button onclick="locateMe(true)">📡 GPS</button>
    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API_BASE = "https://terra-x-backend.onrender.com";

const street = L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 19,
    attribution: "Tiles &copy; Esri"
  }
);

const terrain = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom: 13,
    attribution: "Tiles &copy; Esri"
  }
);

const map = L.map("map", {
  center: [31.95, 35.93],
  zoom: 8,
  layers: [street]
});

const intelMap = L.map("intelMap", {
  center: [31.95, 35.93],
  zoom: 8,
  layers: [satellite]
});

let currentLayer = street;
let currentTarget = null;
let targetMarker = null;
let intelMarker = null;

let areaMode = false;
let areaPoints = [];
let areaMarkers = [];
let areaLine = null;
let areaPolygon = null;

function setLayer(type) {

  map.removeLayer(currentLayer);

  if (type === "street") {
    currentLayer = street;
  }

  if (type === "satellite") {
    currentLayer = satellite;
  }

  if (type === "terrain") {
    currentLayer = terrain;
  }

  currentLayer.addTo(map);
}

function showStatus(text) {

  const box = document.getElementById("status");

  box.textContent = text;
  box.classList.add("show");

  clearTimeout(window.statusTimer);

  window.statusTimer = setTimeout(() => {
    box.classList.remove("show");
  }, 3500);
}

function setTarget(lat, lon, name = "Target") {

  currentTarget = {
    name,
    latitude: lat,
    longitude: lon
  };

  if (targetMarker) {
    map.removeLayer(targetMarker);
  }

  targetMarker = L.marker([lat, lon])
    .addTo(map)
    .bindPopup(
      `<b>${escapeHtml(name)}</b><br>${lat.toFixed(6)}, ${lon.toFixed(6)}`
    )
    .openPopup();

  map.setView([lat, lon], 15);

  document.getElementById("statTarget").textContent = name;

  showStatus("Target selected");
}

function setIntelTarget(lat, lon, name = "Target") {

  currentTarget = {
    name,
    latitude: lat,
    longitude: lon
  };

  if (intelMarker) {
    intelMap.removeLayer(intelMarker);
  }

  intelMarker = L.marker([lat, lon])
    .addTo(intelMap)
    .bindPopup(
      `<b>${escapeHtml(name)}</b>`
    )
    .openPopup();

  intelMap.setView([lat, lon], 15);

  document.getElementById("statTarget").textContent = name;
}

map.on("click", function(e) {

  setTarget(
    e.latlng.lat,
    e.latlng.lng,
    "Map Target"
  );

});

intelMap.on("click", function(e) {

  if (areaMode) {

    areaPoints.push([
      e.latlng.lat,
      e.latlng.lng
    ]);

    const marker = L.circleMarker(
      [e.latlng.lat, e.latlng.lng],
      {
        radius: 5
      }
    ).addTo(intelMap);

    areaMarkers.push(marker);

    if (areaLine) {
      intelMap.removeLayer(areaLine);
    }

    areaLine = L.polyline(areaPoints)
      .addTo(intelMap);

    return;
  }

  setIntelTarget(
    e.latlng.lat,
    e.latlng.lng,
    "Intel Target"
  );

});

async function searchPlace() {

  const query =
    document.getElementById("searchInput").value.trim();

  if (!query) return;

  showStatus("Searching...");

  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2" +
      "&addressdetails=1" +
      "&namedetails=1" +
      "&limit=8" +
      "&q=" +
      encodeURIComponent(query);

    const response = await fetch(url);

    const data = await response.json();

    renderResults(data);

  } catch (error) {

    showStatus("Search failed");

  }

}

function renderResults(data) {

  const panel =
    document.getElementById("resultsPanel");

  const results =
    document.getElementById("results");

  results.innerHTML = "";

  if (!data.length) {

    results.innerHTML =
      `<div class="empty">No results found.</div>`;

    panel.classList.add("show");

    return;
  }

  data.forEach(item => {

    const card =
      document.createElement("div");

    card.className = "target-card";

    card.innerHTML = `
      <div class="target-name">
        ${escapeHtml(item.display_name)}
      </div>

      <div class="target-coords">
        ${Number(item.lat).toFixed(6)},
        ${Number(item.lon).toFixed(6)}
      </div>
    `;

    card.onclick = () => {

      const lat = Number(item.lat);
      const lon = Number(item.lon);

      setTarget(
        lat,
        lon,
        item.name || "Search Target"
      );

      panel.classList.remove("show");

    };

    results.appendChild(card);

  });

  panel.classList.add("show");
}

async function locateMe(intelligence = false) {

  if (!navigator.geolocation) {

    showStatus("GPS unavailable");

    return;
  }

  showStatus("Getting location...");

  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      if (intelligence) {

        setIntelTarget(
          lat,
          lon,
          "My Location"
        );

      } else {

        setTarget(
          lat,
          lon,
          "My Location"
        );

      }

    },

    () => {

      showStatus("Could not get location");

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}

function openIntel() {

  document
    .getElementById("intel")
    .classList.add("active");

  setTimeout(() => {
    intelMap.invalidateSize();
  }, 200);

  if (currentTarget) {

    setIntelTarget(
      currentTarget.latitude,
      currentTarget.longitude,
      currentTarget.name
    );

  }

}

function closeIntel() {

  document
    .getElementById("intel")
    .classList.remove("active");

}

function selectPoint() {

  areaMode = false;

  showStatus(
    "Tap anywhere on the Intelligence map"
  );

}

function startArea() {

  cancelArea();

  areaMode = true;

  showStatus(
    "Tap points on the map to draw an area"
  );

}

function finishArea() {

  if (areaPoints.length < 3) {

    showStatus(
      "You need at least 3 points"
    );

    return;
  }

  areaMode = false;

  if (areaLine) {
    intelMap.removeLayer(areaLine);
  }

  if (areaPolygon) {
    intelMap.removeLayer(areaPolygon);
  }

  areaPolygon =
    L.polygon(areaPoints)
      .addTo(intelMap);

  const area =
    calculateArea(areaPoints);

  document.getElementById("statArea").textContent =
    formatArea(area);

  showStatus(
    "Area created"
  );

}

function cancelArea() {

  areaMode = false;

  areaPoints = [];

  areaMarkers.forEach(marker => {

    intelMap.removeLayer(marker);

  });

  areaMarkers = [];

  if (areaLine) {

    intelMap.removeLayer(areaLine);

    areaLine = null;

  }

  if (areaPolygon) {

    intelMap.removeLayer(areaPolygon);

    areaPolygon = null;

  }

  document.getElementById("statArea").textContent =
    "—";

}

function calculateArea(points) {

  let area = 0;

  const R = 6378137;

  for (
    let i = 0;
    i < points.length;
    i++
  ) {

    const j =
      (i + 1) % points.length;

    const lat1 =
      points[i][0] *
      Math.PI / 180;

    const lat2 =
      points[j][0] *
      Math.PI / 180;

    const lon1 =
      points[i][1] *
      Math.PI / 180;

    const lon2 =
      points[j][1] *
      Math.PI / 180;

    area +=
      (lon2 - lon1) *
      (2 + Math.sin(lat1) + Math.sin(lat2));

  }

  return Math.abs(area * R * R / 2);

}

function formatArea(area) {

  if (area < 1000000) {

    return Math.round(area)
      .toLocaleString() + " m²";

  }

  return (
    area / 1000000
  ).toFixed(2) + " km²";

}

async function saveCurrentTarget() {

  if (!currentTarget) {

    showStatus(
      "Select a target first"
    );

    return;

  }

  showStatus("Saving target...");

  try {

    const response =
      await fetch(
        API_BASE + "/api/targets",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify(
            currentTarget
          )
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.detail || "Save failed"
      );

    }

    showStatus(
      "Target saved successfully"
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "Could not save target"
    );

  }

}

async function loadTargets() {

  showStatus(
    "Loading saved targets..."
  );

  try {

    const response =
      await fetch(
        API_BASE + "/api/targets"
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.detail || "Loading failed"
      );

    }

    renderSavedTargets(
      data.targets || []
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "Could not load targets"
    );

  }

}

function renderSavedTargets(targets) {

  const panel =
    document.getElementById("resultsPanel");

  const results =
    document.getElementById("results");

  results.innerHTML = "";

  if (!targets.length) {

    results.innerHTML =
      `<div class="empty">
        No saved targets yet.
      </div>`;

    panel.classList.add("show");

    return;
  }

  targets.forEach(target => {

    const card =
      document.createElement("div");

    card.className =
      "target-card";

    card.innerHTML = `
      <div class="target-name">
        ${escapeHtml(target.name)}
      </div>

      <div class="target-coords">
        ${Number(target.latitude).toFixed(6)},
        ${Number(target.longitude).toFixed(6)}
      </div>
    `;

    card.onclick = () => {

      setTarget(
        Number(target.latitude),
        Number(target.longitude),
        target.name
      );

      panel.classList.remove("show");

    };

    results.appendChild(card);

  });

  panel.classList.add("show");

}

async function analyzeTarget() {

  if (!currentTarget) {

    showStatus(
      "Select a target first"
    );

    return;

  }

  showStatus(
    "Analysis engine coming next..."
  );

}

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
        </html>
